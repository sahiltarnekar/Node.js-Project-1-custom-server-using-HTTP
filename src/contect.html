<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex flex-col min-h-screen">

<nav class="bg-gray-900 text-white p-4">
  <div class="max-w-6xl mx-auto flex justify-between">
    <h1 class="font-bold">Node Project</h1>
    <div class="space-x-4">
      <a href="/" class="hover:text-blue-400">Home</a>
      <a href="/about" class="hover:text-blue-400">About</a>
      <a href="/course" class="hover:text-blue-400">Course</a>
       <a href="/services" class="hover:text-blue-400">Services</a>
      <a href="/contact" class="hover:text-blue-400">Contact</a>
    </div>
  </div>
</nav>

<main class="flex-grow max-w-xl mx-auto p-6">
  <h2 class="text-2xl font-bold mb-4">Contact Us</h2>

  <form class="space-y-4">
    <input class="w-full border p-2 rounded" placeholder="Name" required>
    <input class="w-full border p-2 rounded" type="email" placeholder="Email" required>
    <textarea class="w-full border p-2 rounded" placeholder="Message"></textarea>
    <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
      Submit
    </button>
  </form>
</main>

<footer class="bg-gray-900 text-white text-center p-3">
  © 2026 Node Project
</footer>

</body>
</html>
